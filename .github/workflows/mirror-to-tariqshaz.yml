name: Mirror to tariqshaz/biz-tech-board

on:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to tariqshaz repo
        env:
          TARGET_REPO: tariqshaz/biz-tech-board
          TARGET_BRANCH: main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # Add the target remote using a PAT stored as TARGET_PAT secret
          git remote add target "https://x-access-token:${{ secrets.TARGET_PAT }}@github.com/${{ env.TARGET_REPO }}.git"

          # Push current HEAD to the target branch (non-forced). Will fail if histories diverge.
          git push target HEAD:refs/heads/${{ env.TARGET_BRANCH }}
